[build-system]
requires = [ "setuptools>=77", "setuptools-scm",]
build-backend = "setuptools.build_meta"

[project]
name = "bcfms"
version = "1.3.1b0"
readme = "README.md"
requires-python = ">=3.11"
authors = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "arches @ git+https://github.com/bcgov/arches@v8.0.10-bcgov-1",
    "arches-component-lab @ git+https://github.com/bcgov/arches-component-lab@v0.0.1a13-bcgov",
    "arches-querysets[drf] @ git+https://github.com/archesproject/arches-querysets@dev/1.1.x",
    "bcgov-arches-common @ git+https://github.com/bcgov/bcgov-arches-common@v2.0.4",
    "django-storages==1.13",
    "python-dotenv",
]
dynamic = []

[project.license]
text = "GNU AGPL3"

[tool.setuptools]
packages = [ "bcfms",]

[dependency-groups]
dev = [ "livereload", "sst", "coverage", "django-silk==5.1.0", "pre-commit==3.8.0", "black>=26.3.1",]
jupyter = [
    { include-group = "dev" },
    "ipykernel",
    "jupyterlab",
    "pandas",
    "matplotlib",
    "seaborn",
    "tabulate",
    "openpyxl",
    "nbstripout",
]
