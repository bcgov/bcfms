version: '3.8'
name: bcfms
services:
  bcfms:
    container_name: bcfms
    # Set this to the appropriate platform in the .env if required
    # eg linux/arm64, linux/amd64
    platform: ${DOCKER_HOST_PLATFORM:-linux}
    hostname: bcfms
    image: bcgov/bcfms
    build:
      context: ..
      dockerfile: bcfms/Dockerfile
      args:
        # Set this to true in the .env or in the host env if debugging with PyCharm
        INSTALL_PYCHARM_DEBUG: ${INSTALL_PYCHARM_DEBUG:-false}
    environment:
      PYCHARM_DEBUG: ${PYCHARM_DEBUG:-false}
    command: run_arches
    volumes:
      - ../arches/:/web_root/arches
      - ./:/web_root/bcfms
      - ../bcgov-arches-common/:/web_root/bcgov-arches-common
      - ../arches-component-lab/:/web_root/arches-component-lab
      - ../arches-querysets/:/web_root/arches-querysets
    env_file:
      - ./.env
      - ./docker/docker.dev.env
    ports:
      - 5689:5678
#      - 81:80
      - 444:443
      - 5174:5174
    stdin_open: true
    tty: true

  bcfms-jupyter:
    container_name: bcfms-jupyter
    image: bcgov/bcfms-jupyter          # reuse the same image
    build:
      context: ..
      dockerfile: bcfms/Dockerfile
      target: jupyter
    volumes:
      - ../arches/:/web_root/arches
      - ./:/web_root/bcfms
      - ../bcgov-arches-common/:/web_root/bcgov-arches-common
      - ../arches-component-lab/:/web_root/arches-component-lab
      - ../arches-querysets/:/web_root/arches-querysets
    env_file:
      - ./.env
      - ./docker/docker.dev.env
    ports:
      - "8889:8888"
    depends_on:
      - bcfms
    stdin_open: true
    tty: true

  bcfms-proxy:
    container_name: bcfms-proxy
    image: nginx:1.25-alpine
    depends_on:
      - bcfms
    ports:
      - "81:80"          # expose the proxy on host:81
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  bcfms-pg_tileserv:
    container_name: bcfms-pg_tileserv
    hostname: bcfms-pg_tileserv
    image: pramsey/pg_tileserv:latest
    env_file:
      - ./docker/pg_tileserv/pg_tileserv.env
    ports:
      - "7800:7800"
    stdin_open: true
    tty: true

networks:
  default:
    external: true
#    name: arches7-5-dev
    name: arches7-5-2-dev


volumes:
  arches-log-bcfms7-5:
  arches-static-bcfms7-5: